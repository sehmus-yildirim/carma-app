appId: de.plaqa.app
name: plaqa Redmi camera permission prompt
tags:
  - block5
  - redmi
  - permissions
  - camera
---
- tapOn: "Melden"
- extendedWaitUntil:
    visible: ".*Was möchtest du melden.*"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Foto aufnehmen"
      enabled: true
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 70
- tapOn:
    text: "Foto aufnehmen"
    enabled: true
- extendedWaitUntil:
    visible: ".*(Bilder und Videos|Fotos und Videos|Kamera).*"
    timeout: 30000
- assertNotVisible: "Null check operator used on a null value"
- assertNotVisible: "A RenderFlex overflowed"
- assertNotVisible: ".*isn't responding.*"
