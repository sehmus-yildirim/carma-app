name: carisma
description: "CaRisma is a modern social contact app for drivers and vehicle-related communication."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  cloud_functions: ^6.2.0
  firebase_storage: ^13.0.4

  google_sign_in: ^6.3.0

  geolocator: ^13.0.2
  image_picker: ^1.2.1
  camera: ^0.12.0+1
  video_player: ^2.11.1
  photo_manager: ^3.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/carisma_logo.png
    - assets/images/carisma_logo_transparent.png
    - assets/images/google_g_logo.png
    - assets/flags/
    - assets/coats/de/states/
    - assets/coats/at/states/
    - assets/coats/ch/cantons/
    - assets/coats/ch/
    - assets/plate_seals/de/
    - assets/plate_seals/at/
    - assets/plate_seals/ch/
    - assets/data/
