name: plaqa
description: "plaqa is a modern social contact app for drivers and vehicle-related communication."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  cloud_functions: ^6.2.0
  firebase_storage: ^13.0.4

  google_sign_in: ^6.3.0

  geolocator: ^13.0.2
  image_picker: ^1.2.1
  camera: ^0.12.0+1
  video_player: ^2.11.1
  photo_manager: ^3.10.0
  firebase_app_check: 0.4.3
  firebase_messaging: ^16.2.0
  crypto: ^3.0.7
  share_plus: ^13.3.0
  shared_preferences: ^2.5.4
  file_picker: ^12.0.0
  url_launcher: ^6.3.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/plaqa_logo.png
    - assets/images/plaqa_logo_transparent.png
    - assets/images/plaqa_app_icon.png
    - assets/images/debug_bmw_x6_m50d.png
    - assets/images/google_g_logo.png
    - assets/flags/
    - assets/coats/de/states/
    - assets/coats/at/states/
    - assets/coats/ch/cantons/
    - assets/coats/ch/
    - assets/plate_seals/de/
    - assets/plate_seals/at/
    - assets/plate_seals/ch/
    - assets/data/
